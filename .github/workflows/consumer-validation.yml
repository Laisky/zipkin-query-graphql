name: Consumer contracts
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      ZIPKIN_ES_INTEGRATION: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: true
      - name: Synthetic dependency and runtime contracts
        run: go test -mod=readonly -count=1 -timeout=30s -run '^(TestConsumer.*|TestURLJoin|TestESIntegration.*)$' ./...
